[project]
name = "voice-ai-agent"
version = "0.1.0"
description = "LiveKit agent worker with OpenAI Realtime voice"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "livekit-agents[openai,silero,groq]~=1.5",
  "livekit-plugins-openai>=1.0.0",
  "livekit-plugins-groq>=1.0.0",
  "livekit-plugins-silero>=1.0.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.0",
  "structlog>=24.4.0",
  "sentry-sdk>=2.18.0",
  "httpx>=0.27.0",
  "edge-tts>=6.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
]

[project.scripts]
voice-agent = "voice_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voice_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
